# WebDownloader — nginx reverse proxy
# Backend must be running (e.g. systemd webdownloader.service) on 127.0.0.1:8000.
#
# Install:
#   sudo cp deploy/nginx-webdownloader.conf /etc/nginx/sites-available/webdownloader
#   sudo ln -s /etc/nginx/sites-available/webdownloader /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Optional: run backend only on localhost when using nginx (see README).

server {
    listen 80;
    # listen 443 ssl;  # uncomment for HTTPS and set ssl_certificate / ssl_certificate_key
    server_name _;   # replace with your domain or leave _ for default

    # Optional: HTTPS (uncomment and set paths)
    # ssl_certificate     /etc/ssl/certs/your-cert.pem;
    # ssl_certificate_key /etc/ssl/private/your-key.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Streaming downloads: do not buffer so large files stream correctly
    location ~ ^/api/download {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
